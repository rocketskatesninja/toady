<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#04070b"/>
  <!-- toady field mark (RES blue): three portals linked = a control field = a triangle -->
  <polygon points="32,15 14,50 50,50" fill="#38bdf8" opacity="0.16"/>
  <polygon points="32,15 14,50 50,50" fill="none" stroke="#38bdf8" stroke-width="3.4" stroke-linejoin="round"/>
  <g fill="#38bdf8">
    <circle cx="32" cy="15" r="4.2"/>
    <circle cx="14" cy="50" r="4.2"/>
    <circle cx="50" cy="50" r="4.2"/>
  </g>
  <g fill="#04070b">
    <circle cx="32" cy="15" r="1.5"/>
    <circle cx="14" cy="50" r="1.5"/>
    <circle cx="50" cy="50" r="1.5"/>
  </g>
</svg>
